<!DOCTYPE html>
<html>
<head>
    <title>Log - VELO NERO</title>
    <meta charset="UTF-8">
    <style>
        body { background-color: #121212; color: #fff; font-family: Arial, sans-serif; padding: 50px; text-align: center; }
        h1 { color: #ff3b3b; font-size: 50px; margin-bottom: 20px; text-shadow: 0 0 12px #ff3b3b80; }
        table { width: 90%; margin: 0 auto; border-collapse: collapse; }
        th, td { padding: 12px 20px; border: 1px solid #ff3b3b33; text-align: left; }
        th { background-color: #1e1e1e; color: #ff3b3b; }
        td { background-color: #1e1e1e; }
        tr:hover td { background-color: #3a0000; }
        a.back { display: inline-block; margin-top: 20px; padding: 10px 20px; color: #fff; background-color: #ff3b3b; border-radius: 6px; text-decoration: none; transition: 0.3s; }
        a.back:hover { background-color: #cc0000; }
    </style>
</head>
<body>

<h1>Log Attività</h1>

<!-- Sezione Login History -->
<div class="section">
    <h2>📋 Cronologia Login</h2>
    <div class="buttons">
        <button class="btn" onclick="refreshLoginLogs()">🔄 Aggiorna</button>
        <button class="btn danger" onclick="clearLoginLogs()">🗑️ Cancella Cronologia</button>
    </div>
    <table>
        <thead>
            <tr>
                <th>Data/Ora</th>
                <th>Email</th>
                <th>Nome in Game</th>
                <th>Azione</th>
            </tr>
        </thead>
        <tbody id="loginLogBody">
            <tr><td colspan="4" style="text-align: center; color: #ff7b7b;">Nessun log disponibile</td></tr>
        </tbody>
    </table>
</div>

<!-- Sezione Utenti Registrati -->
<div class="section">
    <h2>👥 Utenti Registrati</h2>
    <table>
        <thead>
            <tr>
                <th>Email</th>
                <th>Nome in Game</th>
                <th>Ruolo</th>
                <th>Ultimo Accesso</th>
            </tr>
        </thead>
        <tbody id="usersBody">
            <tr><td colspan="4" style="text-align: center; color: #ff7b7b;">Nessun utente registrato</td></tr>
        </tbody>
    </table>
</div>

<!-- Sezione Log Attività Generale -->
<div class="section">
    <h2>⚙️ Log Attività</h2>
    <table>
        <thead>
            <tr>
                <th>Data/Ora</th>
                <th>Utente</th>
                <th>Azione</th>
            </tr>
        </thead>
        <tbody id="logBody">
            <!-- log dinamici -->
        </tbody>
    </table>
</div>

<a href="index.html" class="back">Torna al Dashboard</a>

<script>
const LOGS_KEY = "vn_login_logs";
const ACTIVITY_LOGS_KEY = "vn_activity_logs";
const USERS_KEY = "vn_users_v2";

const logBody = document.getElementById('logBody');
const loginLogBody = document.getElementById('loginLogBody');
const usersBody = document.getElementById('usersBody');

// ===== GESTIONE LOGIN LOGS =====
function loadLoginLogs() {
    try {
        const raw = localStorage.getItem(LOGS_KEY);
        const arr = raw ? JSON.parse(raw) : [];
        return Array.isArray(arr) ? arr : [];
    } catch {
        return [];
    }
}

function saveLoginLogs(arr) {
    localStorage.setItem(LOGS_KEY, JSON.stringify(arr));
}

function recordLogin(email, gameName) {
    const logs = loadLoginLogs();
    logs.push({
        ts: Date.now(),
        email: email,
        gameName: gameName,
        action: "LOGIN"
    });
    saveLoginLogs(logs);
}

function refreshLoginLogs() {
    const logs = loadLoginLogs().slice().sort((a, b) => b.ts - a.ts);
    loginLogBody.innerHTML = "";
    
    if (logs.length === 0) {
        loginLogBody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #ff7b7b;">Nessun log disponibile</td></tr>`;
        return;
    }

    logs.forEach(log => {
        const when = new Date(log.ts).toLocaleString();
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td>${when}</td>
            <td>${log.email}</td>
            <td>${log.gameName || '—'}</td>
            <td>${log.action}</td>
        `;
        loginLogBody.appendChild(tr);
    });
}

function clearLoginLogs() {
    const ok = confirm("Confermi cancellazione di TUTTI i log di login?");
    if (!ok) return;
    localStorage.removeItem(LOGS_KEY);
    refreshLoginLogs();
}

// ===== VISUALIZZA UTENTI =====
function loadUsers() {
    try {
        const raw = localStorage.getItem(USERS_KEY);
        const arr = raw ? JSON.parse(raw) : [];
        return Array.isArray(arr) ? arr : [];
    } catch {
        return [];
    }
}

function refreshUsers() {
    const users = loadUsers().slice().sort((a, b) => (a.email || "").localeCompare(b.email || ""));
    usersBody.innerHTML = "";

    if (users.length === 0) {
        usersBody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #ff7b7b;">Nessun utente registrato</td></tr>`;
        return;
    }

    users.forEach(u => {
        const logs = loadLoginLogs().filter(l => l.email === u.email);
        const lastLogin = logs.length > 0 
            ? new Date(logs[0].ts).toLocaleString() 
            : "Mai";
        
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td>${u.email}</td>
            <td>${u.gameName || '—'}</td>
            <td>${u.role || 'Nessuno'}</td>
            <td>${lastLogin}</td>
        `;
        usersBody.appendChild(tr);
    });
}

// ===== GESTIONE LOG ATTIVITÀ =====
function loadActivityLogs() {
    try {
        const raw = localStorage.getItem(ACTIVITY_LOGS_KEY);
        const arr = raw ? JSON.parse(raw) : [];
        return Array.isArray(arr) ? arr : [];
    } catch {
        return [];
    }
}

function saveActivityLogs(arr) {
    localStorage.setItem(ACTIVITY_LOGS_KEY, JSON.stringify(arr));
}

function addLog(user, action) {
    const logs = loadActivityLogs();
    logs.push({
        ts: Date.now(),
        user: user,
        action: action
    });
    saveActivityLogs(logs);
    refreshActivityLogs();
}

function refreshActivityLogs() {
    const logs = loadActivityLogs().slice().sort((a, b) => b.ts - a.ts);
    logBody.innerHTML = "";

    if (logs.length === 0) {
        logBody.innerHTML = `<tr><td colspan="3" style="text-align: center; color: #ff7b7b;">Nessun log disponibile</td></tr>`;
        return;
    }

    logs.forEach(log => {
        const when = new Date(log.ts).toLocaleString();
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${when}</td><td>${log.user}</td><td>${log.action}</td>`;
        logBody.appendChild(tr);
    });
}

// ===== INIZIALIZZAZIONE =====
function init() {
    refreshLoginLogs();
    refreshUsers();
    refreshActivityLogs();
}

init();
</script>

</body>
</html>
