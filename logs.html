<!DOCTYPE html>
<html>
<head>
  <title>Logs - VELO NERO</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { background-color:#121212; color:#fff; font-family: Arial, sans-serif; padding: 50px 18px; margin:0; }
    h1 { color:#ff3b3b; font-size: 50px; margin: 12px 0 10px 0; text-shadow: 0 0 12px #ff3b3b80; text-align:center; }

    .topbar{
      max-width:1200px; margin:0 auto 10px auto;
      display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;
    }
    .userpill { display:flex; gap:10px; align-items:center; justify-content:flex-end; flex-wrap:wrap; }
    .pill {
      display:inline-block; padding:6px 10px; border-radius:999px;
      border:1px solid #ff1a1a55; background:#1a1a1a; color:#fff; font-size:13px;
      box-shadow:0 0 10px #ff1a1a22 inset, 0 0 10px #ff000033;
    }
    .linkbtn{
      background:none; border:1px solid #ff1a1a55; color:#fff; cursor:pointer;
      padding:8px 12px; border-radius:10px;
      box-shadow:0 0 10px #ff1a1a22 inset, 0 0 10px #ff000033;
      text-decoration:none;
      display:inline-block;
    }
    .linkbtn:hover { background:#2b0000; border-color:#ff1a1a88; }

    .wrap{ max-width:1200px; margin: 0 auto; }
    .subtitle{ text-align:center; color:#ff7b7b; margin: 0 0 16px 0; }

    .grid{
      display:grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 16px;
    }

    .card{
      background: linear-gradient(145deg, #1a1a1a, #2b0000);
      border-radius: 12px;
      box-shadow: 0 0 12px #ff1a1a66, 0 0 16px #ff000099 inset;
      padding: 16px;
    }

    .headrow{ display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:10px; }
    .headrow h2{ margin:0; font-size:18px; }
    .btn{
      border:1px solid #ff1a1a55;
      background:#1a1a1a;
      color:#fff;
      cursor:pointer;
      padding:8px 12px;
      border-radius:10px;
      box-shadow:0 0 10px #ff1a1a22 inset, 0 0 10px #ff000033;
    }
    .btn:hover{ background:#2b0000; border-color:#ff1a1a88; }

    table{ width:100%; border-collapse: collapse; overflow:hidden; border-radius:10px; }
    th, td{ padding:10px; border-bottom:1px solid #ff1a1a22; text-align:left; font-size:13px; vertical-align: top; }
    th{ color:#ffb3b3; font-weight:700; }
    tr:hover td{ background:#1a0c0c; }

    .muted{ color:#ffb3b3; font-size:13px; }
    .ok{ color:#7bffb5; font-size:13px; }
    .err{ color:#ff7b7b; font-size:13px; }

    .badge{
      display:inline-block; padding:4px 10px; border-radius:999px;
      border:1px solid #ff1a1a55; background:#1a1a1a; font-size:12px;
    }
  </style>
</head>
<body>

<div class="topbar">
  <a href="index.html" class="linkbtn">⬅ Dashboard</a>
  <div class="userpill">
    <span class="pill" id="pillEmail">Non autenticato</span>
    <span class="pill" id="pillRole">Ruolo: —</span>
    <button class="linkbtn" onclick="logout()">Esci</button>
  </div>
</div>

<h1>Logs</h1>
<div class="subtitle">Ruoli / Azioni / Traffico (armi & droga)</div>

<div class="wrap">
  <div id="msg" class="muted" style="margin:0 0 12px 0;"></div>

  <div class="grid">

    <div class="card">
      <div class="headrow">
        <h2>Log ruoli</h2>
        <button class="btn" onclick="loadRolesLog()">Aggiorna</button>
      </div>
      <div style="overflow:auto;">
        <table>
          <thead>
            <tr>
              <th>Quando</th>
              <th>Chi</th>
              <th>Target</th>
              <th>Ruolo</th>
            </tr>
          </thead>
          <tbody id="tbodyRoles">
            <tr><td colspan="4" class="muted">—</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <div class="headrow">
        <h2>Azioni</h2>
        <button class="btn" onclick="loadActions()">Aggiorna</button>
      </div>
      <div style="overflow:auto;">
        <table>
          <thead>
            <tr>
              <th>Quando</th>
              <th>Importo</th>
              <th>Note</th>
              <th>Chi</th>
            </tr>
          </thead>
          <tbody id="tbodyActions">
            <tr><td colspan="4" class="muted">—</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <div class="headrow">
        <h2>Traffico - Armi</h2>
        <button class="btn" onclick="loadTraffic('armi')">Aggiorna</button>
      </div>
      <div style="overflow:auto;">
        <table>
          <thead>
            <tr>
              <th>Quando</th>
              <th>Tipo</th>
              <th>Articolo</th>
              <th>Qty</th>
            </tr>
          </thead>
          <tbody id="tbodyArmi">
            <tr><td colspan="4" class="muted">—</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <div class="headrow">
        <h2>Traffico - Droga</h2>
        <button class="btn" onclick="loadTraffic('droga')">Aggiorna</button>
      </div>
      <div style="overflow:auto;">
        <table>
          <thead>
            <tr>
              <th>Quando</th>
              <th>Tipo</th>
              <th>Prodotto</th>
              <th>Qty</th>
            </tr>
          </thead>
          <tbody id="tbodyDroga">
            <tr><td colspan="4" class="muted">—</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>
</div>

<script>
  const pillEmail = document.getElementById("pillEmail");
  const pillRole  = document.getElementById("pillRole");
  const msgEl = document.getElementById("msg");

  const tbodyRoles = document.getElementById("tbodyRoles");
  const tbodyActions = document.getElementById("tbodyActions");
  const tbodyArmi = document.getElementById("tbodyArmi");
  const tbodyDroga = document.getElementById("tbodyDroga");

  async function apiGet(url){
    const r = await fetch(url, { method:"GET", credentials:"include" });
    return r.json();
  }
  async function apiPost(url, data){
    const r = await fetch(url, {
      method:"POST",
      credentials:"include",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify(data || {})
    });
    return r.json();
  }

  function setMsg(ok, text){
    msgEl.className = ok ? "ok" : "err";
    msgEl.textContent = text || "";
  }

  async function logout(){
    try { await apiPost("/api/auth/logout", {}); } catch {}
    window.location.href = "index.html";
  }

  function fmtWhen(ms){
    if (!ms) return "—";
    try { return new Date(ms).toLocaleString(); } catch { return String(ms); }
  }

  function escapeHtml(s) {
    return String(s ?? "")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  async function guard(){
    const me = await apiGet("/api/auth/me");
    if (!me?.authenticated) {
      window.location.href = "index.html";
      return;
    }
    const role = (me.user?.role || "none").toLowerCase();
    if (role === "none") {
      alert("Sei in attesa di ruolo: accesso non consentito.");
      window.location.href = "index.html";
      return;
    }
    pillEmail.textContent = me.user.email || "—";
    pillRole.textContent  = "Ruolo: " + role;
  }

  async function loadRolesLog(){
    tbodyRoles.innerHTML = `<tr><td colspan="4" class="muted">Caricamento ..</td></tr>`;
    const out = await apiGet("/api/admin/get-roles-log?limit=50");
    if (!out?.ok) {
      tbodyRoles.innerHTML = `<tr><td colspan="4" class="muted">Errore</td></tr>`;
      return;
    }
    const items = out.items || [];
    if (!items.length) {
      tbodyRoles.innerHTML = `<tr><td colspan="4" class="muted">Nessun log</td></tr>`;
      return;
    }
    tbodyRoles.innerHTML = items.map(x => `
      <tr>
        <td>${fmtWhen(x.at)}</td>
        <td>${escapeHtml(x.by || "—")} <span class="badge">${escapeHtml(x.byRole || "—")}</span></td>
        <td>${escapeHtml(x.target || "—")}</td>
        <td><span class="badge">${escapeHtml(x.role || "—")}</span></td>
      </tr>
    `).join("");
  }

  async function loadActions(){
    tbodyActions.innerHTML = `<tr><td colspan="4" class="muted">Caricamento ..</td></tr>`;
    const out = await apiGet("/api/actions/list?limit=100");
    if (!out?.ok) {
      tbodyActions.innerHTML = `<tr><td colspan="4" class="muted">Errore</td></tr>`;
      return;
    }
    const items = out.items || [];
    if (!items.length) {
      tbodyActions.innerHTML = `<tr><td colspan="4" class="muted">Nessuna azione</td></tr>`;
      return;
    }
    tbodyActions.innerHTML = items.map(x => `
      <tr>
        <td>${fmtWhen(x.at)}</td>
        <td>${escapeHtml(String(x.amount ?? "—"))}</td>
        <td>${escapeHtml(x.notes || "")}</td>
        <td>${escapeHtml(x.by || "—")} <span class="badge">${escapeHtml(x.byRole || "—")}</span></td>
      </tr>
    `).join("");
  }

  async function loadTraffic(area){
    const tbody = area === "armi" ? tbodyArmi : tbodyDroga;
    tbody.innerHTML = `<tr><td colspan="4" class="muted">Caricamento ..</td></tr>`;

    const out = await apiGet("/api/traffic/list?area=" + encodeURIComponent(area) + "&limit=100");
    if (!out?.ok) {
      tbody.innerHTML = `<tr><td colspan="4" class="muted">Errore</td></tr>`;
      return;
    }

    const items = out.items || [];
    if (!items.length) {
      tbody.innerHTML = `<tr><td colspan="4" class="muted">Nessun record</td></tr>`;
      return;
    }

    tbody.innerHTML = items.map(x => `
      <tr>
        <td>${fmtWhen(x.at)}</td>
        <td><span class="badge">${escapeHtml(x.type || "—")}</span></td>
        <td>${escapeHtml(x.item || "—")}</td>
        <td>${escapeHtml(String(x.qty ?? "—"))}</td>
      </tr>
    `).join("");
  }

  (async function init(){
    await guard();
    loadRolesLog();
    loadActions();
    loadTraffic("armi");
    loadTraffic("droga");
  })();
</script>

</body>
</html>
