<!DOCTYPE html>
<html>
<head>
    <title>Comandi - VELO NERO</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        body {
            background-color: #121212;
            color: #fff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px 18px;
            margin: 0;
        }

        .topbar{
          max-width:1200px; margin:0 auto 10px auto;
          display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;
        }
        .userpill { display:flex; gap:10px; align-items:center; justify-content:flex-end; flex-wrap:wrap; }
        .pill {
          display:inline-block; padding:6px 10px; border-radius:999px;
          border:1px solid #ff1a1a55; background:#1a1a1a; color:#fff; font-size:13px;
          box-shadow:0 0 10px #ff1a1a22 inset, 0 0 10px #ff000033;
        }
        .linkbtn{
          background:none; border:1px solid #ff1a1a55; color:#fff; cursor:pointer;
          padding:8px 12px; border-radius:10px;
          box-shadow:0 0 10px #ff1a1a22 inset, 0 0 10px #ff000033;
          text-decoration:none;
          display:inline-block;
        }
        .linkbtn:hover { background:#2b0000; border-color:#ff1a1aaa; }

        h1 {
            color: #ff3b3b;
            font-size: 50px;
            margin: 12px 0 10px 0;
            text-shadow: 0 0 12px #ff3b3b80;
        }
        p.subtitle {
            color: #ff7b7b;
            font-size: 18px;
            margin-bottom: 30px;
        }
        .command-box {
            display: inline-block;
            background: linear-gradient(145deg, #1a1a1a, #2b0000);
            padding: 30px 40px;
            margin: 20px;
            border-radius: 12px;
            box-shadow: 0 0 12px #ff1a1a66, 0 0 16px #ff000099 inset;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .command-box:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px #ff1a1a99, 0 0 25px #ff0000cc inset;
        }
        a.back {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            color: #fff;
            background-color: #ff3b3b;
            border-radius: 6px;
            text-decoration: none;
        }
        a.back:hover { background-color: #cc0000; }

        .hint { color:#ff7b7b; font-size:14px; margin-top:10px; }
    </style>
</head>
<body>

<div class="topbar">
  <a href="index.html" class="linkbtn">⬅ Dashboard</a>
  <div class="userpill">
    <span class="pill" id="pillEmail">Non autenticato</span>
    <span class="pill" id="pillRole">Ruolo: —</span>
    <button class="linkbtn" id="btnLogout" onclick="logout()">Esci</button>
  </div>
</div>

<h1>Comandi</h1>
<p class="subtitle">Sezione pronta per collegamenti futuri</p>

<div class="command-box">
    <h2>Funzioni disponibili</h2>
    <p>Nessuna simulazione attiva</p>
</div>

<div class="hint">Accesso consentito solo agli utenti con ruolo assegnato (non “Nessuno”).</div>

<a href="index.html" class="back">Torna alla Dashboard</a>

<script>
  // Protezione pagina (stesso storage di index.html)
  const USERS_KEY = "vn_users_v2";
  const SESSION_KEY = "vn_session_v1";

  const pillEmail = document.getElementById("pillEmail");
  const pillRole  = document.getElementById("pillRole");

  function loadSession() {
    try { return JSON.parse(localStorage.getItem(SESSION_KEY)) || null; } catch { return null; }
  }
  function clearSession() { localStorage.removeItem(SESSION_KEY); }

  function loadUsers() {
    try {
      const raw = localStorage.getItem(USERS_KEY);
      const arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr : [];
    } catch { return []; }
  }
  function findUserByEmail(email) {
    const users = loadUsers();
    return users.find(u => (u.email || "").toLowerCase() === (email || "").toLowerCase()) || null;
  }

  function logout(){
    clearSession();
    window.location.href = "index.html";
  }

  (function guard(){
    const s = loadSession();
    if (!s?.email) {
      window.location.href = "index.html";
      return;
    }

    const u = findUserByEmail(s.email);
    if (!u) {
      clearSession();
      window.location.href = "index.html";
      return;
    }

    if (u.blocked) {
      clearSession();
      alert("Account bloccato.");
      window.location.href = "index.html";
      return;
    }

    // ✅ Solo con ruolo assegnato
    if ((u.role || "Nessuno") === "Nessuno") {
      alert("Sei in attesa di ruolo: accesso non consentito.");
      window.location.href = "index.html";
      return;
    }

    pillEmail.textContent = u.email;
    pillRole.textContent  = "Ruolo: " + (u.role || "Nessuno");
  })();
</script>

</body>
</html>
