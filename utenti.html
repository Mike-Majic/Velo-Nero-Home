<!DOCTYPE html>
<html>
<head>
  <title>Utenti - VELO NERO</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { background-color: #121212; color: #fff; font-family: Arial, sans-serif; padding: 50px 18px; text-align: center; margin:0; }
    h1 { color: #ff3b3b; font-size: 50px; margin: 12px 0 10px 0; text-shadow: 0 0 12px #ff3b3b80; }

    .topbar{
      max-width:1200px; margin:0 auto 10px auto;
      display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;
    }
    .userpill { display:flex; gap:10px; align-items:center; justify-content:flex-end; flex-wrap:wrap; }
    .pill {
      display:inline-block; padding:6px 10px; border-radius:999px;
      border:1px solid #ff1a1a55; background:#1a1a1a; color:#fff; font-size:13px;
      box-shadow:0 0 10px #ff1a1a22 inset, 0 0 10px #ff000033;
    }
    .linkbtn{
      background:none; border:1px solid #ff1a1a55; color:#fff; cursor:pointer;
      padding:8px 12px; border-radius:10px;
      box-shadow:0 0 10px #ff1a1a22 inset, 0 0 10px #ff000033;
      text-decoration:none;
      display:inline-block;
    }
    .linkbtn:hover { background:#2b0000; border-color:#ff1a1aaa; }

    .hint { color:#ff7b7b; margin: 0 0 16px 0; }

    table { width: 92%; max-width:1200px; margin: 0 auto; border-collapse: collapse; }
    th, td { padding: 12px 14px; border: 1px solid #ff3b3b33; text-align: left; vertical-align: top; }
    th { background-color: #1e1e1e; color: #ff3b3b; }
    td { background-color: #1e1e1e; }
    tr:hover td { background-color: #3a0000; }

    select {
      background:#121212; border:1px solid #ff1a1a55; color:#fff; border-radius:10px;
      padding:8px 10px; outline:none;
    }

    .btn {
      padding: 9px 12px; border-radius: 8px; border: 1px solid #ff3b3b66;
      background:#1a1a1a; color:#fff; cursor:pointer;
      margin: 4px 6px 0 0;
      box-shadow:0 0 10px #ff1a1a22 inset, 0 0 10px #ff000033;
    }
    .btn:hover { background:#2b0000; }
    .danger { background:#2b0000; border-color:#ff3b3baa; }
    .small { padding:7px 10px; font-size:13px; border-radius:8px; }

    .blocked { color:#ff3b3b; font-weight:bold; }
    .muted { color:#ff7b7b; }
  </style>
</head>
<body>

<div class="topbar">
  <a href="index.html" class="linkbtn">⬅ Dashboard</a>
  <div class="userpill">
    <span class="pill" id="pillEmail">Non autenticato</span>
    <span class="pill" id="pillRole">Ruolo: —</span>
    <button class="linkbtn" onclick="logout()">Esci</button>
  </div>
</div>

<h1>Utenti</h1>
<p class="hint">Accesso riservato ad Admin (Owner / Boss / Vice Boss)</p>

<table>
  <thead>
    <tr>
      <th>Email</th>
      <th>Nome in Game</th>
      <th>Ruolo</th>
      <th>Stato</th>
      <th>Azioni</th>
    </tr>
  </thead>
  <tbody id="usersBody"></tbody>
</table>

<a href="index.html" class="linkbtn" style="margin-top:18px;">Torna alla Dashboard</a>

<script>
/* ===== COSTANTI CONDIVISE ===== */
const SESSION_KEY = "vn_session_v1";
const USERS_KEY = "vn_users_v2";
const TRUST_KEY = "vn_trusted_devices_v1";
const DEVICE_ID_KEY = "vn_device_id_v1";

/* ===== RUOLI (stessi di index) ===== */
const RUOLI = [
  "Nessuno",
  "Owner","Boss","Vice Boss","Consigliere","Gestore incontri","Gestore Gang",
  "Gestore droga","Resp. reperimento droga","Gestore armi","Resp. Craft armi",
  "Capo Gestore braccio armato","Gestore braccio a.","Capo sq. d'assalto Est.",
  "Guardia del corpo","Soldato","Scagnozzo","Scagnozzo in prova"
];

/* ===== UI ===== */
const pillEmail = document.getElementById("pillEmail");
const pillRole  = document.getElementById("pillRole");

/* ===== UTILS ===== */
function loadSession() {
  try { return JSON.parse(localStorage.getItem(SESSION_KEY)) || null; } catch { return null; }
}
function clearSession(){ localStorage.removeItem(SESSION_KEY); }

function loadUsers() {
  try {
    const raw = localStorage.getItem(USERS_KEY);
    const arr = raw ? JSON.parse(raw) : [];
    return Array.isArray(arr) ? arr : [];
  } catch { return []; }
}
function saveUsers(arr){ localStorage.setItem(USERS_KEY, JSON.stringify(arr)); }

function findUserByEmail(email) {
  return loadUsers().find(u => (u.email || "").toLowerCase() === (email || "").toLowerCase()) || null;
}

function escapeHtml(s) {
  return String(s ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function isAdminRole(role){ return ["Owner","Boss","Vice Boss"].includes(role); }

/* ===== TRUST DEVICE (per togliere “ricorda dispositivo” al reset) ===== */
function getDeviceId() {
  let id = localStorage.getItem(DEVICE_ID_KEY);
  if (!id) {
    id = (Math.random().toString(16).slice(2) + Date.now().toString(16));
    localStorage.setItem(DEVICE_ID_KEY, id);
  }
  return id;
}
function loadTrusted() { try { return JSON.parse(localStorage.getItem(TRUST_KEY)) || {}; } catch { return {}; } }
function saveTrusted(obj){ localStorage.setItem(TRUST_KEY, JSON.stringify(obj)); }
function clearTrustedForEmail(email) {
  const deviceId = getDeviceId();
  const t = loadTrusted();
  const e = (email || "").toLowerCase();
  if (t[e] && t[e][deviceId]) {
    delete t[e][deviceId];
    saveTrusted(t);
  }
}

/* ===== 2FA secret generator (minimo necessario per reset) ===== */
const B32_ALPH = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
function base32Encode(bytes) {
  let bits = 0, value = 0, output = "";
  for (const b of bytes) {
    value = (value << 8) | b;
    bits += 8;
    while (bits >= 5) {
      output += B32_ALPH[(value >>> (bits - 5)) & 31];
      bits -= 5;
    }
  }
  if (bits > 0) output += B32_ALPH[(value << (5 - bits)) & 31];
  return output;
}
function randomBytes(n) { const a = new Uint8Array(n); crypto.getRandomValues(a); return a; }
function generateTotpSecret() { return base32Encode(randomBytes(20)); }

/* ===== AUTH GUARD ===== */
let ME = null;

function setHeaderUser(){
  const s = loadSession();
  if (!s?.email) {
    pillEmail.textContent = "Non autenticato";
    pillRole.textContent = "Ruolo: —";
    return;
  }
  const u = findUserByEmail(s.email);
  pillEmail.textContent = s.email;
  pillRole.textContent = "Ruolo: " + (u?.role || "Nessuno");
}

function logout(){
  clearSession();
  window.location.href = "index.html";
}

function bootGuard() {
  const session = loadSession();
  if (!session?.email) {
    window.location.href = "index.html";
    return false;
  }

  const me = findUserByEmail(session.email);
  if (!me) {
    clearSession();
    window.location.href = "index.html";
    return false;
  }

  if (me.blocked) {
    alert("Account bloccato.");
    clearSession();
    window.location.href = "index.html";
    return false;
  }

  if (!isAdminRole(me.role || "Nessuno")) {
    alert("Accesso negato.");
    window.location.href = "index.html";
    return false;
  }

  ME = me;
  setHeaderUser();
  return true;
}

/* ===== PERMESSI ===== */
function canBlockUnblock(){ return ["Owner","Boss"].includes(ME?.role); }
function canExpel(){ return ["Owner","Boss","Vice Boss"].includes(ME?.role); }
function canResetPassword(){ return ["Owner","Boss","Vice Boss"].includes(ME?.role); }
function canReset2FA(){ return ["Owner","Boss"].includes(ME?.role); }

/* ===== ACTIONS ===== */
function setRole(userEmail, newRole){
  const users = loadUsers();
  const u = users.find(x => (x.email||"").toLowerCase() === (userEmail||"").toLowerCase());
  if (!u) return;

  u.role = newRole;
  saveUsers(users);

  // se ho cambiato me stesso aggiorna pill/permessi
  const s = loadSession();
  if (s?.email && s.email.toLowerCase() === u.email.toLowerCase()) {
    ME = u;
    setHeaderUser();
  }
  renderUsers();
}

function blockUser(userEmail, val){
  if (!canBlockUnblock()) return alert("Solo Owner e Boss possono bloccare/sbloccare");
  const users = loadUsers();
  const u = users.find(x => (x.email||"").toLowerCase() === (userEmail||"").toLowerCase());
  if (!u) return;

  u.blocked = !!val;
  saveUsers(users);

  // se blocca se stesso -> logout
  const s = loadSession();
  if (s?.email && s.email.toLowerCase() === u.email.toLowerCase() && u.blocked) {
    alert("Ti sei bloccato: logout.");
    logout();
    return;
  }

  renderUsers();
}

function expelUser(userEmail){
  if (!canExpel()) return alert("Permesso negato");
  const ok = confirm("Confermi espulsione di " + userEmail + "?");
  if (!ok) return;

  const users = loadUsers();
  const filtered = users.filter(x => (x.email||"").toLowerCase() !== (userEmail||"").toLowerCase());
  saveUsers(filtered);

  // se espelle se stesso -> logout
  const s = loadSession();
  if (s?.email && s.email.toLowerCase() === userEmail.toLowerCase()) {
    logout();
    return;
  }

  renderUsers();
}

function resetPassword(userEmail){
  if (!canResetPassword()) return alert("Permesso negato");
  const ok = confirm("Confermi RESET PASSWORD per " + userEmail + "?\nL'utente dovrà impostarne una nuova al prossimo accesso.");
  if (!ok) return;

  const users = loadUsers();
  const u = users.find(x => (x.email||"").toLowerCase() === (userEmail||"").toLowerCase());
  if (!u) return;

  u.passwordHash = null;
  clearTrustedForEmail(u.email);

  saveUsers(users);
  alert("Password resettata.");
  renderUsers();
}

function reset2FA(userEmail){
  if (!canReset2FA()) return alert("Solo Owner e Boss possono resettare il 2FA");
  const ok = confirm("Confermi RESET 2FA per " + userEmail + "?\nL'utente dovrà riconfigurare Authenticator al prossimo login.");
  if (!ok) return;

  const users = loadUsers();
  const u = users.find(x => (x.email||"").toLowerCase() === (userEmail||"").toLowerCase());
  if (!u) return;

  u.totpSecret = generateTotpSecret();
  u.totpNeedsSetup = true;
  clearTrustedForEmail(u.email);

  saveUsers(users);
  alert("2FA resettato. Al prossimo login l’utente farà setup con QR/chiave.");
  renderUsers();
}

/* ===== RENDER ===== */
function renderUsers() {
  const users = loadUsers().slice().sort((a,b) => (a.email || "").localeCompare(b.email || ""));
  const tbody = document.getElementById("usersBody");
  tbody.innerHTML = "";

  if (users.length === 0) {
    tbody.innerHTML = `<tr><td colspan="5" style="color:#ff7b7b;">Nessun utente</td></tr>`;
    return;
  }

  users.forEach(u => {
    const tr = document.createElement("tr");

    const tdEmail = document.createElement("td");
    tdEmail.innerHTML = escapeHtml(u.email) + (u.blocked ? ` <span class="blocked">⛔</span>` : "");

    const tdGame = document.createElement("td");
    tdGame.textContent = u.gameName || "—";

    const tdRole = document.createElement("td");
    const sel = document.createElement("select");
    RUOLI.forEach(r => {
      const opt = document.createElement("option");
      opt.value = r;
      opt.textContent = r;
      if (r === (u.role || "Nessuno")) opt.selected = true;
      sel.appendChild(opt);
    });
    sel.onchange = () => setRole(u.email, sel.value);
    tdRole.appendChild(sel);

    const tdState = document.createElement("td");
    tdState.textContent = u.blocked ? "BLOCCATO" : "ATTIVO";

    const tdActions = document.createElement("td");

    // Reset 2FA
    if (canReset2FA()) {
      const b = document.createElement("button");
      b.className = "btn small";
      b.textContent = "Reset 2FA";
      b.onclick = () => reset2FA(u.email);
      tdActions.appendChild(b);
    }

    // Reset Password
    if (canResetPassword()) {
      const b = document.createElement("button");
      b.className = "btn small";
      b.textContent = "Reset Password";
      b.onclick = () => resetPassword(u.email);
      tdActions.appendChild(b);
    }

    // Blocca/Sblocca
    if (canBlockUnblock()) {
      const b1 = document.createElement("button");
      b1.className = "btn small";
      b1.textContent = "Blocca";
      b1.onclick = () => blockUser(u.email, true);

      const b2 = document.createElement("button");
      b2.className = "btn small";
      b2.textContent = "Sblocca";
      b2.onclick = () => blockUser(u.email, false);

      tdActions.appendChild(b1);
      tdActions.appendChild(b2);
    }

    // Espelli
    if (canExpel()) {
      const b = document.createElement("button");
      b.className = "btn danger small";
      b.textContent = "Espelli";
      b.onclick = () => expelUser(u.email);
      tdActions.appendChild(b);
    }

    // Vice Boss: niente blocca/sblocca, niente reset 2FA (come in index)
    if (ME?.role === "Vice Boss") {
      // rimuovo eventuali bottoni già aggiunti
      Array.from(tdActions.querySelectorAll("button")).forEach(btn => {
        if (btn.textContent === "Blocca" || btn.textContent === "Sblocca" || btn.textContent === "Reset 2FA") btn.remove();
      });
    }

    tr.appendChild(tdEmail);
    tr.appendChild(tdGame);
    tr.appendChild(tdRole);
    tr.appendChild(tdState);
    tr.appendChild(tdActions);

    tbody.appendChild(tr);
  });
}

/* ===== START ===== */
if (bootGuard()) {
  renderUsers();
}
</script>

</body>
</html>
