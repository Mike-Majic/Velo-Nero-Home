<script>
    const myRole = "Boss"; // ruolo di chi sta usando la dashboard

    document.querySelectorAll('.btn-edit').forEach(btn => {
        const parentRow = btn.closest('tr');

        // Mostra il pulsante solo se Owner, Boss o Vice Boss
        if(!["Owner","Boss","Vice Boss"].includes(myRole)) {
            btn.style.display = 'none';
        } else {
            // Personalizza le azioni visibili
            const menu = btn.nextElementSibling;
            if(myRole === "Vice Boss") {
                // Vice Boss può solo Espellere
                menu.querySelectorAll('button').forEach(b => {
                    if(b.innerText !== "Espelli") b.style.display = 'none';
                });
            }
            // Owner e Boss vedono tutto
        }
    });

    function toggleMenu(id) {
        const menu = document.getElementById(id);
        menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
    }

    function azioneUtente(user, azione) {
        alert(`Azione "${azione}" eseguita su ${user}`);
        // qui potrai inserire codice per bloccare/sbloccare/espellere realmente
    }
</script>
