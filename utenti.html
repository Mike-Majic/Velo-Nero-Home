<!DOCTYPE html>
<html>
<head>
  <title>Gestione - VELO NERO</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      background-color: #121212;
      color: #fff;
      font-family: Arial, sans-serif;
      padding: 40px 18px;
      margin: 0;
    }

    .topbar{
      max-width:1200px; margin:0 auto 14px auto;
      display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;
    }
    .userpill { display:flex; gap:10px; align-items:center; justify-content:flex-end; flex-wrap:wrap; }
    .pill {
      display:inline-block; padding:6px 10px; border-radius:999px;
      border:1px solid #ff1a1a55; background:#1a1a1a; color:#fff; font-size:13px;
      box-shadow:0 0 10px #ff1a1a22 inset, 0 0 10px #ff000033;
    }
    .linkbtn{
      background:none; border:1px solid #ff1a1a55; color:#fff; cursor:pointer;
      padding:8px 12px; border-radius:10px;
      box-shadow:0 0 10px #ff1a1a22 inset, 0 0 10px #ff000033;
      text-decoration:none;
      display:inline-block;
    }
    .linkbtn:hover { background:#2b0000; border-color:#ff1a1aaa; }

    h1 {
      color: #ff3b3b;
      font-size: 46px;
      margin: 10px auto 6px auto;
      max-width: 1200px;
      text-shadow: 0 0 12px #ff3b3b80;
    }
    .subtitle {
      max-width: 1200px;
      margin: 0 auto 16px auto;
      color:#ff7b7b;
    }

    .wrap { max-width: 1200px; margin: 0 auto; }

    .card{
      background: linear-gradient(145deg, #1a1a1a, #2b0000);
      border-radius: 12px;
      box-shadow: 0 0 12px #ff1a1a66, 0 0 16px #ff000099 inset;
      padding: 16px;
      margin-top: 14px;
    }

    .row{
      display:flex; gap:10px; align-items:center; flex-wrap:wrap;
      justify-content:space-between;
      margin-bottom: 12px;
    }

    input, select{
      padding:10px 12px;
      border-radius:10px;
      border:1px solid #ff1a1a55;
      background:#141414;
      color:#fff;
      outline:none;
      box-sizing:border-box;
    }

    table{
      width:100%;
      border-collapse: collapse;
      overflow:hidden;
      border-radius: 10px;
    }
    th, td{
      border-bottom: 1px solid #ff1a1a22;
      padding: 10px 10px;
      text-align:left;
      font-size: 14px;
      vertical-align: middle;
    }
    th{ color:#ffb3b3; font-weight: 700; }
    tr:hover td{ background:#1a0c0c; }

    .badge{
      display:inline-block;
      padding:4px 10px;
      border-radius:999px;
      border:1px solid #ff1a1a55;
      background:#1a1a1a;
      font-size:12px;
    }

    .btn{
      border:1px solid #ff1a1a55;
      background:#1a1a1a;
      color:#fff;
      cursor:pointer;
      padding:8px 12px;
      border-radius:10px;
      box-shadow:0 0 10px #ff1a1a22 inset, 0 0 10px #ff000033;
    }
    .btn:hover{ background:#2b0000; border-color:#ff1a1aaa; }

    .ok { color:#7bffb5; font-size:13px; }
    .err{ color:#ff7b7b; font-size:13px; }

    .muted{ color:#ffb3b3; font-size:13px; }
  </style>
</head>
<body>

  <div class="topbar">
    <a href="index.html" class="linkbtn">⬅ Dashboard</a>
    <div class="userpill">
      <span class="pill" id="pillEmail">Non autenticato</span>
      <span class="pill" id="pillRole">Ruolo: —</span>
      <button class="linkbtn" onclick="logout()">Esci</button>
    </div>
  </div>

  <h1>Gestione</h1>
  <div class="subtitle">Lista utenti + cambio ruolo (solo vice/boss/owner).</div>

  <div class="wrap">

    <div class="card">
      <div class="row">
        <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
          <input id="q" placeholder="Cerca email o nome" />
          <button class="btn" onclick="loadUsers()">Aggiorna</button>
        </div>
        <div class="muted" id="meta">—</div>
      </div>

      <div id="msg"></div>

      <div style="overflow:auto;">
        <table>
          <thead>
            <tr>
              <th>Email</th>
              <th>Nome</th>
              <th>Ruolo</th>
              <th style="min-width:220px;">Azioni</th>
            </tr>
          </thead>
          <tbody id="tbody">
            <tr><td colspan="4" class="muted">Caricamento ..</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

<script>
  const pillEmail = document.getElementById("pillEmail");
  const pillRole  = document.getElementById("pillRole");
  const tbody = document.getElementById("tbody");
  const msgEl = document.getElementById("msg");
  const metaEl = document.getElementById("meta");
  const qEl = document.getElementById("q");

  let meRole = "none";

  async function apiGet(url){
    const r = await fetch(url, { method:"GET", credentials:"include" });
    return r.json();
  }
  async function apiPost(url, data){
    const r = await fetch(url, {
      method:"POST",
      credentials:"include",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify(data || {})
    });
    return r.json();
  }

  function setMsg(ok, text){
    msgEl.innerHTML = "";
    if (!text) return;
    const d = document.createElement("div");
    d.className = ok ? "ok" : "err";
    d.style.margin = "10px 0";
    d.textContent = text;
    msgEl.appendChild(d);
  }

  async function logout(){
    try { await apiPost("/api/auth/logout", {}); } catch {}
    window.location.href = "index.html";
  }

  async function guard(){
    const me = await apiGet("/api/auth/me");
    if (!me?.authenticated) {
      window.location.href = "index.html";
      return;
    }

    const role = (me.user?.role || "none").toLowerCase();
    if (!["vice","boss","owner"].includes(role)) {
      alert("Accesso non consentito.");
      window.location.href = "index.html";
      return;
    }

    meRole = role;
    pillEmail.textContent = me.user.email || "—";
    pillRole.textContent  = "Ruolo: " + role;
  }

  function roleBadge(role){
    return `<span class="badge">${role}</span>`;
  }

  function roleOptions(current){
    const roles = ["none","member","vice","boss","owner"];

    // vice: può solo member/none
    let allowed = roles;
    if (meRole === "vice") allowed = ["none","member"];
    if (meRole === "boss") allowed = ["none","member","vice","boss"];
    if (meRole === "owner") allowed = roles;

    return allowed.map(r => {
      const sel = (r === (current || "none")) ? "selected" : "";
      return `<option value="${r}" ${sel}>${r}</option>`;
    }).join("");
  }

  function render(users){
    const q = (qEl.value || "").trim().toLowerCase();

    const filtered = (users || []).filter(u => {
      const email = (u.email || "").toLowerCase();
      const name  = (u.name || "").toLowerCase();
      if (!q) return true;
      return email.includes(q) || name.includes(q);
    });

    metaEl.textContent = `${filtered.length} utenti`;

    if (!filtered.length) {
      tbody.innerHTML = `<tr><td colspan="4" class="muted">Nessun utente</td></tr>`;
      return;
    }

    tbody.innerHTML = filtered.map(u => {
      const email = u.email || "";
      const name  = u.name || "";
      const role  = (u.role || "none").toLowerCase();

      return `
        <tr>
          <td>${email}</td>
          <td>${name || "<span class='muted'>—</span>"}</td>
          <td>${roleBadge(role)}</td>
          <td>
            <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
              <select id="sel_${email.replace(/[^a-z0-9]/gi,'_')}">
                ${roleOptions(role)}
              </select>
              <button class="btn" onclick="setRole('${email}')">Salva</button>
            </div>
          </td>
        </tr>
      `;
    }).join("");
  }

  async function loadUsers(){
    setMsg(true, "");
    tbody.innerHTML = `<tr><td colspan="4" class="muted">Caricamento ..</td></tr>`;

    const out = await apiGet("/api/admin/list-users");
    if (!out?.ok) {
      tbody.innerHTML = `<tr><td colspan="4" class="muted">Errore</td></tr>`;
      setMsg(false, out?.error || "Errore");
      return;
    }

    render(out.users || []);
  }

  async function setRole(email){
    const selId = "sel_" + email.replace(/[^a-z0-9]/gi,'_');
    const sel = document.getElementById(selId);
    const role = sel ? sel.value : "none";

    const out = await apiPost("/api/admin/set-role", { email, role });
    if (!out?.ok) {
      setMsg(false, out?.error || "Errore nel salvataggio");
      return;
    }

    setMsg(true, "Ruolo aggiornato ✅");
    loadUsers();
  }

  (async function init(){
    await guard();
    await loadUsers();
  })();
</script>

</body>
</html>
