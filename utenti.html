<!DOCTYPE html>
<html>
<head>
  <title>Utenti - VELO NERO</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { background-color: #121212; color: #fff; font-family: Arial, sans-serif; padding: 50px 18px; text-align: center; margin:0; }
    h1 { color: #ff3b3b; font-size: 50px; margin: 12px 0 10px 0; text-shadow: 0 0 12px #ff3b3b80; }

    .topbar{
      max-width:1200px; margin:0 auto 10px auto;
      display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;
    }
    .userpill { display:flex; gap:10px; align-items:center; justify-content:flex-end; flex-wrap:wrap; }
    .pill {
      display:inline-block; padding:6px 10px; border-radius:999px;
      border:1px solid #ff1a1a55; background:#1a1a1a; color:#fff; font-size:13px;
      box-shadow:0 0 10px #ff1a1a22 inset, 0 0 10px #ff000033;
    }
    .linkbtn{
      background:none; border:1px solid #ff1a1a55; color:#fff; cursor:pointer;
      padding:8px 12px; border-radius:10px;
      box-shadow:0 0 10px #ff1a1a22 inset, 0 0 10px #ff000033;
      text-decoration:none;
      display:inline-block;
    }
    .linkbtn:hover { background:#2b0000; border-color:#ff1a1aaa; }

    .hint { color:#ff7b7b; margin: 0 0 16px 0; }

    table { width: 92%; max-width:1200px; margin: 0 auto; border-collapse: collapse; }
    th, td { padding: 12px 14px; border: 1px solid #ff3b3b33; text-align: left; vertical-align: top; }
    th { background-color: #1e1e1e; color: #ff3b3b; }
    td { background-color: #1e1e1e; }
    tr:hover td { background-color: #3a0000; }

    select {
      background:#121212; border:1px solid #ff1a1a55; color:#fff; border-radius:10px;
      padding:8px 10px; outline:none;
    }

    .btn {
      padding: 9px 12px; border-radius: 8px; border: 1px solid #ff3b3b66;
      background:#1a1a1a; color:#fff; cursor:pointer;
      margin: 4px 6px 0 0;
      box-shadow:0 0 10px #ff1a1a22 inset, 0 0 10px #ff000033;
    }
    .btn:hover { background:#2b0000; }
    .small { padding:7px 10px; font-size:13px; border-radius:8px; }

    .muted { color:#ff7b7b; }
    .ok { color:#7bffb5; }
    .err { color:#ff7b7b; }
  </style>
</head>
<body>

<div class="topbar">
  <a href="index.html" class="linkbtn">⬅ Dashboard</a>
  <div class="userpill">
    <span class="pill" id="pillEmail">Non autenticato</span>
    <span class="pill" id="pillRole">Ruolo: —</span>
    <button class="linkbtn" onclick="logout()">Esci</button>
  </div>
</div>

<h1>Utenti</h1>
<p class="hint">Accesso riservato ad Admin (owner / boss / vice)</p>

<div id="msg" class="muted" style="max-width:1200px;margin:0 auto 10px auto;"></div>

<div style="max-width:1200px;margin:0 auto 12px auto; display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap;">
  <button class="btn small" onclick="loadUsers()">Aggiorna</button>
</div>

<table>
  <thead>
    <tr>
      <th>Email</th>
      <th>Nome</th>
      <th>Ruolo</th>
      <th>Azioni</th>
    </tr>
  </thead>
  <tbody id="usersBody"></tbody>
</table>

<a href="index.html" class="linkbtn" style="margin-top:18px;">Torna alla Dashboard</a>

<script>
  const pillEmail = document.getElementById("pillEmail");
  const pillRole  = document.getElementById("pillRole");
  const msgEl = document.getElementById("msg");
  const tbody = document.getElementById("usersBody");

  let myRole = "none";

  async function apiGet(url){
    const r = await fetch(url, { method:"GET", credentials:"include" });
    return r.json();
  }
  async function apiPost(url, data){
    const r = await fetch(url, {
      method:"POST",
      credentials:"include",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify(data || {})
    });
    return r.json();
  }

  function setMsg(ok, text){
    msgEl.className = ok ? "ok" : "err";
    msgEl.textContent = text || "";
  }

  async function logout(){
    try { await apiPost("/api/auth/logout", {}); } catch {}
    window.location.href = "index.html";
  }

  function escapeHtml(s) {
    return String(s ?? "")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  function allowedRolesForMe(){
    const all = ["none","member","vice","boss","owner"];
    if (myRole === "vice") return ["none","member"];
    if (myRole === "boss") return ["none","member","vice","boss"];
    if (myRole === "owner") return all;
    return [];
  }

  async function guard(){
    const me = await apiGet("/api/auth/me");
    if (!me?.authenticated) {
      window.location.href = "index.html";
      return false;
    }

    myRole = (me.user?.role || "none").toLowerCase();
    if (!["vice","boss","owner"].includes(myRole)) {
      alert("Accesso negato.");
      window.location.href = "index.html";
      return false;
    }

    pillEmail.textContent = me.user.email || "—";
    pillRole.textContent  = "Ruolo: " + myRole;
    return true;
  }

  function render(users){
    tbody.innerHTML = "";
    if (!users || !users.length) {
      tbody.innerHTML = `<tr><td colspan="4" class="muted">Nessun utente</td></tr>`;
      return;
    }

    const allowed = allowedRolesForMe();

    users.forEach(u => {
      const tr = document.createElement("tr");

      const tdEmail = document.createElement("td");
      tdEmail.innerHTML = escapeHtml(u.email || "—");

      const tdName = document.createElement("td");
      tdName.textContent = u.name || "—";

      const tdRole = document.createElement("td");
      const currentRole = (u.role || "none").toLowerCase();

      const sel = document.createElement("select");
      allowed.forEach(r => {
        const opt = document.createElement("option");
        opt.value = r;
        opt.textContent = r;
        if (r === currentRole) opt.selected = true;
        sel.appendChild(opt);
      });
      tdRole.appendChild(sel);

      const tdActions = document.createElement("td");
      const btn = document.createElement("button");
      btn.className = "btn small";
      btn.textContent = "Salva";
      btn.onclick = async () => {
        setMsg(true, "");
        const out = await apiPost("/api/admin/set-role", { email: u.email, role: sel.value });
        if (!out?.ok) return setMsg(false, out?.error || "Errore");
        setMsg(true, "Ruolo aggiornato ✅");
        loadUsers();
      };
      tdActions.appendChild(btn);

      tr.appendChild(tdEmail);
      tr.appendChild(tdName);
      tr.appendChild(tdRole);
      tr.appendChild(tdActions);

      tbody.appendChild(tr);
    });
  }

  async function loadUsers(){
    setMsg(true, "");
    tbody.innerHTML = `<tr><td colspan="4" class="muted">Caricamento ..</td></tr>`;

    const out = await apiGet("/api/admin/list-users");
    if (!out?.ok) {
      tbody.innerHTML = `<tr><td colspan="4" class="muted">Errore</td></tr>`;
      setMsg(false, out?.error || "Errore");
      return;
    }

    render(out.users || []);
  }

  (async function init(){
    const ok = await guard();
    if (ok) loadUsers();
  })();
</script>

</body>
</html>
