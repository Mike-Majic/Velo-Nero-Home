<!DOCTYPE html>
<html>
<head>
  <title>VELO NERO</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body { background-color:#0d0d0d; color:#fff; font-family:Arial,sans-serif; text-align:center; padding:60px 20px; margin:0; }
    h1 { font-size:60px; letter-spacing:5px; color:#ff1a1a; text-shadow:0 0 12px #ff000080; margin:0 0 10px 0; }
    p.subtitle { font-size:20px; color:#ff6666; margin:0 0 28px 0; }

    .topbar {
      max-width:1200px; margin:0 auto 18px auto;
      display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;
      text-align:left;
    }
    .userpill { display:flex; gap:10px; align-items:center; justify-content:flex-end; flex-wrap:wrap; }
    .pill {
      display:inline-block; padding:6px 10px; border-radius:999px;
      border:1px solid #ff1a1a55; background:#1a1a1a; color:#fff; font-size:13px;
      box-shadow:0 0 10px #ff1a1a22 inset, 0 0 10px #ff000033;
    }
    .linkbtn {
      background:none; border:1px solid #ff1a1a55; color:#fff; cursor:pointer;
      padding:8px 12px; border-radius:10px;
      box-shadow:0 0 10px #ff1a1a22 inset, 0 0 10px #ff000033;
    }
    .linkbtn:hover { background:#2b0000; border-color:#ff1a1aaa; }

    .nav { display:flex; justify-content:center; gap:12px; flex-wrap:wrap; margin-bottom:28px; }
    .nav button {
      background-color:#1a1a1a; color:#fff; border:1px solid #ff1a1a55;
      padding:10px 16px; border-radius:10px; cursor:pointer;
      box-shadow:0 0 10px #ff1a1a44 inset, 0 0 12px #ff000066;
    }
    .nav button.active { background-color:#2b0000; border-color:#ff1a1aaa; }

    .section { display:none; max-width:1200px; margin:0 auto; text-align:left; }
    .section.active { display:block; }

    .cards { text-align:center; }
    .box {
      display:inline-block; background-color:#1a1a1a; padding:40px 60px; margin:12px;
      border-radius:12px; box-shadow:0 0 12px #ff1a1a66 inset, 0 0 16px #ff000099;
      cursor:pointer; color:#fff; min-width:260px;
    }
    .box:hover { background:#2b0000; }
    .box h2 { font-size:28px; margin:0 0 10px 0; color:#ff1a1a; }
    .box p { font-size:16px; color:#ff6666; margin:0; }

    .box.wide {
      display:block;
      max-width:620px;
      margin:18px auto 0 auto;
      padding:42px 40px;
    }

    table { width:100%; border-collapse:collapse; margin-top:12px; }
    th, td { padding:10px 12px; border:1px solid #ff1a1a33; background:#1e1e1e; }
    th { color:#ff3b3b; }
    tr:hover td { background:#3a0000; }

    .hint { color:#ff7b7b; font-size:14px; margin-top:6px; }
    .muted { color:#ffaaaa; font-size:13px; }
  </style>
</head>

<body>

  <div class="topbar">
    <div></div>
    <div class="userpill">
      <span class="pill" id="pillEmail">Non autenticato</span>
      <span class="pill" id="pillRole">Ruolo: —</span>
      <button class="linkbtn" id="btnLogout" onclick="logout()" style="display:none;">Esci</button>
    </div>
  </div>

  <h1>VELO NERO</h1>
  <p class="subtitle">Sistema Privato Interno</p>

<div class="nav">
  <button onclick="showSection('dashboard')">Dashboard</button>

  <button onclick="showSection('azioni')">Azioni</button>

  <button onclick="showSection('contabilita')">Contabilità</button>

  <button id="btnUtenti" onclick="showSection('utenti')">Utenti</button>

  <button onclick="location.href='diario.html'">Diario</button>

  <button id="btnLog" onclick="goToLogs()">Log</button>

  <button onclick="window.location.href='comandi.html'">Armi / Droga</button>
</div>

  <!-- DASHBOARD -->
  <div id="dashboard" class="section active">
    <div class="cards">

      <div class="box" onclick="showSection('azioni')">
        <h2>Azioni</h2>
        <p>Azioni</p>
      </div>

      <div class="box" onclick="location.href='diario.html'">
        <h2>Diario</h2>
        <p>Note</p>
      </div>

      <div class="box" onclick="showSection('utenti')">
        <h2>Utenti</h2>
        <p>Gestione</p>
      </div>

      <div class="box" onclick="showSection('contabilita')">
        <h2>Contabilità</h2>
        <p>Stipendi & Cassa</p>
      </div>

      <div class="box wide" onclick="window.location.href='comandi.html'">
        <h2>Gestione Armi-Droga</h2>
        <p>Funzioni</p>
      </div>

    </div>
  </div>

  <!-- CONTABILITÀ -->
  <div id="contabilita" class="section">
    <h2 style="color:#ff3b3b;">Contabilità</h2>
    <div class="hint">50% stipendi · 50% cassa · divisione per partecipanti</div>

    <table>
      <thead>
        <tr>
          <th>Utente</th>
          <th>Guadagnato</th>
          <th>Perso</th>
          <th>Stipendio</th>
        </tr>
      </thead>
      <tbody id="contabilitaTable"></tbody>
    </table>

    <div class="hint" id="contabilitaSummary"></div>
  </div>

<script>
function showSection(id){
  document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  if(id==="contabilita") renderContabilita();
}

/* === MOCK DATA ===
   Usa le tue funzioni vere loadOps / loadUsers
*/
function loadOps(){
  return JSON.parse(localStorage.getItem("vn_ops_v4")||"[]");
}

function renderContabilita(){
  const ops = loadOps();
  const map = {};
  let total = 0;

  ops.forEach(op=>{
    const parts = op.participants?.length ? op.participants : [op.userEmail];
    const split = parts.length;

    parts.forEach(e=>{
      if(!map[e]) map[e]={gain:0,loss:0};
      const q = (op.money||0)/split;
      if(op.type==="ottenuto"){ map[e].gain+=q; total+=q; }
      else { map[e].loss+=q; total-=q; }
    });
  });

  const pay = total*0.5;
  const users = Object.keys(map).filter(e=>map[e].gain>0);
  const per = users.length ? pay/users.length : 0;

  const tb=document.getElementById("contabilitaTable");
  tb.innerHTML="";
  Object.entries(map).forEach(([e,v])=>{
    tb.innerHTML+=`
      <tr>
        <td>${e}</td>
        <td>$${Math.round(v.gain)}</td>
        <td>$${Math.round(v.loss)}</td>
        <td>$${users.includes(e)?Math.round(per):0}</td>
      </tr>`;
  });

  document.getElementById("contabilitaSummary").innerHTML=
    `Totale: $${Math.round(total)} · In cassa: $${Math.round(total*0.5)}`;
}
</script>

</body>
</html>
