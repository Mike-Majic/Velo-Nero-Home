<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>VELO NERO</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{margin:0;font-family:Arial;background:#0d0d0d;color:#fff}
h1{text-align:center;color:#ff1a1a;letter-spacing:6px}
.nav{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:20px}
.nav button{background:#1a1a1a;color:#fff;border:1px solid #ff1a1a55;padding:10px 16px;border-radius:8px;cursor:pointer;font-weight:800}
.nav button.active{background:#300;border-color:#ff1a1a}
.section{display:none;max-width:1100px;margin:0 auto;padding:20px}
.section.active{display:block}
.box{background:#1a1a1a;border:1px solid #ff1a1a44;border-radius:10px;padding:16px;margin-bottom:16px}
input,select,textarea{background:#121212;color:#fff;border:1px solid #ff1a1a44;border-radius:6px;padding:8px}
table{width:100%;border-collapse:collapse}
th,td{border:1px solid #ff1a1a33;padding:8px}
th{color:#ff3b3b}
.btn{background:#1a1a1a;border:1px solid #ff1a1a99;color:#fff;padding:8px 14px;border-radius:6px;cursor:pointer;font-weight:800}
.btn.danger{background:#300}
.tag{display:inline-block;background:#300;border:1px solid #ff1a1a55;padding:4px 8px;border-radius:999px;font-size:12px;margin:2px}
</style>
</head>

<body>

<h1>VELO NERO</h1>

<div class="nav">
<button onclick="show('dashboard')" class="active">Dashboard</button>
<button onclick="show('azioni')">Azioni</button>
<button onclick="show('diario')">Diario</button>
<button onclick="show('gestione')">Gestione</button>
<button onclick="show('contabilita')">Contabilità</button>
<button onclick="show('utenti')">Utenti</button>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="section active">
<div class="box">Sistema operativo VELO NERO attivo.</div>
</div>

<!-- AZIONI -->
<div id="azioni" class="section">
<div class="box">
<h3>Nuova azione</h3>
<input id="azioneTesto" placeholder="Descrizione azione">
<button class="btn" onclick="addAzione()">Salva</button>
</div>
<div class="box">
<h3>Storico azioni</h3>
<ul id="azioniList"></ul>
</div>
</div>

<!-- DIARIO -->
<div id="diario" class="section">
<div class="box">
<h3>Nuova nota</h3>
<input id="notaTitolo" placeholder="Titolo"><br><br>
<textarea id="notaTesto" placeholder="Testo nota"></textarea><br><br>
<button class="btn" onclick="addNota()">Salva nota</button>
</div>
<div class="box">
<h3>Diario</h3>
<ul id="diarioList"></ul>
</div>
</div>

<!-- GESTIONE -->
<div id="gestione" class="section">
<div class="box">
<h3>Gestione armi / droga</h3>
<input id="itemNome" placeholder="Item">
<input id="itemQty" type="number" value="1">
<button class="btn" onclick="addItem()">Aggiungi</button>
</div>
<div class="box">
<h3>Inventario</h3>
<ul id="invList"></ul>
</div>
</div>

<!-- CONTABILITÀ -->
<div id="contabilita" class="section">
<div class="box">
<h3>Movimento</h3>
<input id="moneyVal" type="number" placeholder="Importo">
<select id="moneyType">
<option value="in">Entrata</option>
<option value="out">Uscita</option>
</select>
<button class="btn" onclick="addMoney()">Registra</button>
</div>
<div class="box">
<h3>Saldo</h3>
<div id="saldo">$0</div>
</div>
</div>

<!-- UTENTI -->
<div id="utenti" class="section">
<div class="box">
<h3>Utenti (demo)</h3>
<div class="tag">Owner</div>
<div class="tag">Boss</div>
<div class="tag">Soldato</div>
</div>
</div>

<script>
function show(id){
document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'))
document.getElementById(id).classList.add('active')
document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'))
event.target.classList.add('active')
}

/* AZIONI */
function addAzione(){
const t=document.getElementById('azioneTesto').value
if(!t) return
const a=JSON.parse(localStorage.getItem('azioni')||'[]')
a.push(t)
localStorage.setItem('azioni',JSON.stringify(a))
renderAzioni()
}
function renderAzioni(){
const ul=document.getElementById('azioniList')
ul.innerHTML=''
JSON.parse(localStorage.getItem('azioni')||'[]').forEach(x=>{
const li=document.createElement('li')
li.textContent=x
ul.appendChild(li)
})
}

/* DIARIO */
function addNota(){
const t=document.getElementById('notaTitolo').value
const b=document.getElementById('notaTesto').value
if(!t||!b) return
const d=JSON.parse(localStorage.getItem('diario')||'[]')
d.push({t,b})
localStorage.setItem('diario',JSON.stringify(d))
renderDiario()
}
function renderDiario(){
const ul=document.getElementById('diarioList')
ul.innerHTML=''
JSON.parse(localStorage.getItem('diario')||'[]').forEach(n=>{
const li=document.createElement('li')
li.textContent=n.t+' – '+n.b
ul.appendChild(li)
})
}

/* GESTIONE */
function addItem(){
const n=document.getElementById('itemNome').value
const q=parseInt(document.getElementById('itemQty').value)
if(!n||q<=0) return
const inv=JSON.parse(localStorage.getItem('inv')||'{}')
inv[n]=(inv[n]||0)+q
localStorage.setItem('inv',JSON.stringify(inv))
renderInv()
}
function renderInv(){
const ul=document.getElementById('invList')
ul.innerHTML=''
const inv=JSON.parse(localStorage.getItem('inv')||'{}')
for(let k in inv){
const li=document.createElement('li')
li.textContent=k+': '+inv[k]
ul.appendChild(li)
}
}

/* CONTABILITÀ */
function addMoney(){
const v=parseInt(document.getElementById('moneyVal').value)
if(!v) return
let s=parseInt(localStorage.getItem('saldo')||'0')
s+=document.getElementById('moneyType').value==='in'?v:-v
localStorage.setItem('saldo',s)
renderSaldo()
}
function renderSaldo(){
document.getElementById('saldo').textContent='$'+(localStorage.getItem('saldo')||0)
}

renderAzioni()
renderDiario()
renderInv()
renderSaldo()
</script>

</body>
</html>
