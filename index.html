<!DOCTYPE html>
<html>
<head>
    <title>VELO NERO - Dashboard</title>
    <meta charset="UTF-8">
    <style>
        body {
            background-color: #0d0d0d;
            color: #fff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 100px 20px;
        }

        h1 {
            font-size: 60px;
            letter-spacing: 5px;
            color: #ff1a1a;
            text-shadow: 0 0 12px #ff000080;
            margin-bottom: 10px;
        }

        p.subtitle {
            font-size: 20px;
            color: #ff6666;
            margin-bottom: 50px;
        }

        .box {
            display: inline-block;
            background-color: #1a1a1a;
            padding: 40px 60px;
            margin: 20px;
            border-radius: 12px;
            box-shadow: 0 0 12px #ff1a1a66 inset, 0 0 16px #ff000099;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            text-decoration: none;
            color: #fff;
        }

        .box:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px #ff1a1a99 inset, 0 0 25px #ff0000cc;
        }

        .box h2 {
            font-size: 28px;
            margin-bottom: 10px;
            color: #ff1a1a;
        }

        .box p {
            font-size: 16px;
            color: #ff6666;
        }
    </style>
</head>
<body>

<h1>VELO NERO</h1>
<p class="subtitle">Sistema Privato Interno</p>

<a href="utenti.html" class="box">
    <h2>Utenti</h2>
    <p>Gestione ruoli e accessi</p>
</a>

<a href="logs.html" class="box">
    <h2>Logs</h2>
    <p>Attività interne recenti</p>
</a>

<a href="comandi.html" class="box">
    <h2>Comandi</h2>
    <p>Esegui azioni interne</p>
</a>

</body>
</html>
