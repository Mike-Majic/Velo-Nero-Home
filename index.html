<!DOCTYPE html>
<html>
<head>
    <title>VELO NERO</title>
    <meta charset="UTF-8">
    <style>
        body {
            background-color: #0b0b0b;
            color: #fff;
            font-family: 'Arial', sans-serif;
            text-align: center;
            padding: 50px 20px;
        }

        h1 {
            font-size: 70px;
            letter-spacing: 6px;
            color: #ff1a1a;
            margin-bottom: 10px;
        }

        p.subtitle {
            font-size: 22px;
            color: #ff4d4d;
            margin-bottom: 50px;
        }

        .dashboard {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
        }

        .box {
            background: linear-gradient(145deg, #1a1a1a, #2b0000);
            padding: 40px 30px;
            border-radius: 12px;
            width: 280px;
            box-shadow: 0 0 20px #ff1a1a50;
            transition: transform 0.3s ease;
        }

        .box:hover {
            transform: scale(1.05);
        }

        h2 {
            color: #ff1a1a;
            margin-bottom: 15px;
        }

        p {
            font-size: 16px;
            color: #ff6666;
            margin-bottom: 20px;
        }

        .btn {
            display: inline-block;
            padding: 10px 20px;
            color: #fff;
            background-color: #ff1a1a;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            text-decoration: none;
            transition: background 0.3s ease;
        }

        .btn:hover {
            background-color: #cc0000;
        }

        @media(max-width: 900px) {
            .dashboard {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>

<body>

    <div class="dashboard">
        <div class="box">

            <a href="#" class="btn">Apri</a>
        </div>
        <div class="box">
            <h2>Logs</h2>
            <p>Controllo attività interne</p>
            <a href="#" class="btn">Apri</a>
        </div>
        <div class="box">
            <h2>Comandi</h2>
            <p>Esegui operazioni interne</p>
            <a href="#" class="btn">Apri</a>
<div class="box">
    <h2>Utenti</h2>

</div>
<div class="box">

    <p>Controllo attività interne</p>

<div class="box">

</body>
</html>
