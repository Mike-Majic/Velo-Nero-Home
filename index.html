<!DOCTYPE html>
<html>
<head>
    <title>VELO NERO</title>
    <meta charset="UTF-8">
    <style>
        body {
            background-color: #0b0b0b;
            color: #fff;
            font-family: 'Arial', sans-serif;
            text-align: center;
            padding-top: 80px;
        }

        h1 {
            font-size: 70px;
            letter-spacing: 6px;
            color: #ff1a1a;
            margin-bottom: 10px;
        }

        p.subtitle {
            font-size: 22px;
            color: #ff4d4d;
            margin-bottom: 40px;
        }

        .box {
            margin-top: 40px;
            background: linear-gradient(145deg, #1a1a1a, #2b0000);
            display: inline-block;
            padding: 40px 60px;
            border-radius: 12px;
            box-shadow: 0 0 20px #ff1a1a50;
            transition: transform 0.3s ease;
        }

        .box:hover {
            transform: scale(1.05);
        }

        h2 {
            color: #ff1a1a;
            margin-bottom: 15px;
        }

        p {
            font-size: 18px;
            color: #ff6666;
        }

        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 25px;
            color: #fff;
            background-color: #ff1a1a;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s ease;
            text-decoration: none;
        }

        .btn:hover {
            background-color: #cc0000;
        }
    </style>
</head>

<body>

    <h1>VELO NERO</h1>
    <p class="subtitle">Sistema Privato Interno</p>

    <div class="box">
        <h2>Accesso Riservato</h2>
        <p>Dashboard in costruzione...</p>
        <a href="#" class="btn">Entra</a>
    </div>

</body>
</html>
