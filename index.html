<!DOCTYPE html>
<html>
<head>
    <title>Log - VELO NERO</title>
    <meta charset="UTF-8">
    <style>
        body { background-color: #121212; color: #fff; font-family: Arial, sans-serif; padding: 50px; text-align: center; }
        h1 { color: #ff3b3b; font-size: 50px; margin-bottom: 20px; text-shadow: 0 0 12px #ff3b3b80; }
        table { width: 90%; margin: 0 auto; border-collapse: collapse; }
        th, td { padding: 12px 20px; border: 1px solid #ff3b3b33; text-align: left; }
        th { background-color: #1e1e1e; color: #ff3b3b; }
        td { background-color: #1e1e1e; }
        tr:hover td { background-color: #3a0000; }
        a.back { display: inline-block; margin-top: 20px; padding: 10px 20px; color: #fff; background-color: #ff3b3b; border-radius: 6px; text-decoration: none; transition: 0.3s; }
        a.back:hover { background-color: #cc0000; }
    </style>
</head>
<body>

<h1>Log Attività</h1>

<table>
    <thead>
        <tr>
            <th>Data/Ora</th>
            <th>Utente</th>
            <th>Azione</th>
        </tr>
    </thead>
    <tbody id="logBody">
        <!-- log dinamici -->
    </tbody>
</table>

<a href="utenti.html" class="back">Torna agli Utenti</a>

<script>
const logBody = document.getElementById('logBody');

// funzione che può essere richiamata da utenti.html
function addLog(user, action) {
    const tr = document.createElement('tr');
    const now = new Date();
    tr.innerHTML = `<td>${now.toLocaleString()}</td><td>${user}</td><td>${action}</td>`;
    logBody.prepend(tr); // mette la riga in cima
}
</script>

</body>
</html>
