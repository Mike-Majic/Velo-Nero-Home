<!DOCTYPE html>
<html>
<head>
  <title>VELO NERO</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body { background:#0d0d0d; color:#fff; font-family:Arial,sans-serif; text-align:center; padding:60px 20px; margin:0; }
    h1 { font-size:60px; letter-spacing:5px; color:#ff1a1a; text-shadow:0 0 12px #ff000080; margin:0 0 10px; }
    p.subtitle { font-size:20px; color:#ff6666; margin:0 0 28px; }

    .nav { display:flex; justify-content:center; margin-bottom:28px; }
    .nav button {
      background:#1a1a1a; color:#fff; border:1px solid #ff1a1a55;
      padding:10px 16px; border-radius:10px; cursor:pointer;
    }

    .section { display:none; max-width:1200px; margin:0 auto; text-align:left; }
    .section.active { display:block; }

    .cards { text-align:center; }
    .box {
      display:inline-block; background:#1a1a1a; padding:40px 60px; margin:12px;
      border-radius:12px; box-shadow:0 0 12px #ff1a1a66 inset, 0 0 16px #ff000099;
      cursor:pointer; min-width:260px;
    }
    .box:hover { background:#2b0000; }
    .box h2 { color:#ff1a1a; margin:0 0 10px; }

    .box.wide {
      display:block;
      max-width:620px;
      margin:18px auto;
      padding:42px 40px;
    }

    table { width:100%; border-collapse:collapse; margin-top:12px; }
    th, td { padding:10px; border:1px solid #ff1a1a33; background:#1e1e1e; }
    th { color:#ff3b3b; }
  </style>
</head>

<body>

<h1>VELO NERO</h1>
<p class="subtitle">Sistema Privato Interno</p>

<div class="nav">
  <button onclick="showSection('dashboard')">Dashboard</button>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="section active">
  <div class="cards">

    <div class="box" onclick="showSection('azioni')">
      <h2>Azioni</h2>
      <p>Azioni</p>
    </div>

    <div class="box" onclick="location.href='diario.html'">
      <h2>Diario</h2>
      <p>Note</p>
    </div>

    <div class="box wide" onclick="window.location.href='comandi.html'">
      <h2>Gestione Armi-Droga</h2>
      <p>Funzioni</p>
    </div>

    <div class="box" onclick="showSection('utenti')">
      <h2>Utenti</h2>
      <p>Gestione</p>
    </div>

    <div class="box" onclick="showSection('contabilita')">
      <h2>Contabilità</h2>
      <p>Stipendi & Cassa</p>
    </div>

  </div>
</div>

<!-- AZIONI -->
<div id="azioni" class="section">
  <h2 style="color:#ff3b3b;">Azioni</h2>
  <p class="subtitle">Sezione azioni (qui rientrerà tutto il sistema)</p>
</div>

<!-- UTENTI -->
<div id="utenti" class="section">
  <h2 style="color:#ff3b3b;">Utenti</h2>
  <p class="subtitle">Gestione utenti</p>
</div>

<!-- CONTABILITÀ -->
<div id="contabilita" class="section">
  <h2 style="color:#ff3b3b;">Contabilità</h2>

  <table>
    <thead>
      <tr>
        <th>Utente</th>
        <th>Guadagnato</th>
        <th>Perso</th>
        <th>Stipendio</th>
      </tr>
    </thead>
    <tbody id="contabilitaTable"></tbody>
  </table>

  <div id="contabilitaSummary"></div>
</div>

<script>
function showSection(id){
  document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
  const el = document.getElementById(id);
  if(el) el.classList.add("active");
  if(id==="contabilita") renderContabilita();
}

function loadOps(){
  return JSON.parse(localStorage.getItem("vn_ops_v4")||"[]");
}

function renderContabilita(){
  const ops = loadOps();
  const map = {};
  let total = 0;

  ops.forEach(op=>{
    const parts = op.participants?.length ? op.participants : [op.userEmail];
    const split = parts.length;

    parts.forEach(e=>{
      if(!map[e]) map[e]={gain:0,loss:0};
      const q = (op.money||0)/split;
      if(op.type==="ottenuto"){ map[e].gain+=q; total+=q; }
      else { map[e].loss+=q; total-=q; }
    });
  });

  const pay = total*0.5;
  const users = Object.keys(map).filter(e=>map[e].gain>0);
  const per = users.length ? pay/users.length : 0;

  const tb=document.getElementById("contabilitaTable");
  tb.innerHTML="";
  Object.entries(map).forEach(([e,v])=>{
    tb.innerHTML+=`
      <tr>
        <td>${e}</td>
        <td>$${Math.round(v.gain)}</td>
        <td>$${Math.round(v.loss)}</td>
        <td>$${users.includes(e)?Math.round(per):0}</td>
      </tr>`;
  });

  document.getElementById("contabilitaSummary").innerText =
    `Totale: $${Math.round(total)} · In cassa: $${Math.round(total*0.5)}`;
}
</script>

</body>
</html>
