<!DOCTYPE html>
<html>
<head>
    <title>VELO NERO - Dashboard</title>
    <meta charset="UTF-8">
    <style>
        body {
            background-color: #0b0b0b;
            color: #fff;
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #1a1a1a;
            padding: 20px;
            text-align: center;
            box-shadow: 0 0 10px #ff1a1a50;
        }

        header h1 {
            color: #ff1a1a;
            font-size: 48px;
            margin: 0;
            letter-spacing: 3px;
            text-shadow: 0 0 10px #ff000080;
        }

        nav {
            background-color: #2b0000;
            display: flex;
            justify-content: center;
            padding: 15px 0;
        }

        nav a {
            color: #fff;
            text-decoration: none;
            margin: 0 20px;
            font-size: 16px;
            padding: 6px 12px;
            border-radius: 6px;
            transition: background 0.3s ease;
        }

        nav a:hover {
            background-color: #ff1a1a;
        }

        main {
            text-align: center;
            padding: 80px 20px;
        }

        .box {
            display: inline-block;
            background-color: #1a1a1a;
            padding: 40px 60px;
            margin: 20px;
            border-radius: 12px;
            box-shadow: 0 0 20px #ff1a1a50 inset, 0 0 20px #ff000080;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .box:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px #ff1a1a80 inset, 0 0 30px #ff000080;
        }

        .box h2 {
            color: #ff1a1a;
            margin-bottom: 10px;
            font-size: 24px;
        }

        .box p {
            color: #ff6666;
            font-size: 16px;
        }

    </style>
</head>
<body>

<header>
    <h1>VELO NERO</h1>
</header>

<nav>
    <a href="index.html">Dashboard</a>
    <a href="utenti.html">Utenti</a>
    <a href="logs.html">Logs</a>
    <a href="comandi.html">Comandi</a>
</nav>

<main>
    <div class="box">
        <h2>Utenti</h2>
        <p>Gestione ruoli e accessi</p>
    </div>
    <div class="box">
        <h2>Logs</h2>
        <p>Attività interne recenti</p>
    </div>
    <div class="box">
        <h2>Comandi</h2>
        <p>Esegui azioni interne</p>
    </div>
</main>

</body>
</html>
