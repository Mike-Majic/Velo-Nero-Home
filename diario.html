<!DOCTYPE html>
<html>
<head>
  <title>Diario - VELO NERO</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { background-color:#121212; color:#fff; font-family: Arial, sans-serif; padding: 50px 18px; margin:0; }
    h1 { color:#ff3b3b; font-size: 50px; margin: 12px 0 10px 0; text-shadow: 0 0 12px #ff3b3b80; text-align:center; }

    .topbar{
      max-width:1200px; margin:0 auto 10px auto;
      display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;
    }
    .userpill { display:flex; gap:10px; align-items:center; justify-content:flex-end; flex-wrap:wrap; }
    .pill {
      display:inline-block; padding:6px 10px; border-radius:999px;
      border:1px solid #ff1a1a55; background:#1a1a1a; color:#fff; font-size:13px;
      box-shadow:0 0 10px #ff1a1a22 inset, 0 0 10px #ff000033;
    }
    .linkbtn{
      background:none; border:1px solid #ff1a1a55; color:#fff; cursor:pointer;
      padding:8px 12px; border-radius:10px;
      box-shadow:0 0 10px #ff1a1a22 inset, 0 0 10px #ff000033;
      text-decoration:none;
      display:inline-block;
    }
    .linkbtn:hover { background:#2b0000; border-color:#ff1a1aaa; }

    .wrap{ max-width:1200px; margin: 0 auto; }
    .subtitle{ text-align:center; color:#ff7b7b; margin: 0 0 16px 0; }

    .grid{
      display:grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    .card{
      background: linear-gradient(145deg, #1a1a1a, #2b0000);
      border-radius: 12px;
      box-shadow: 0 0 12px #ff1a1a66, 0 0 16px #ff000099 inset;
      padding: 16px;
    }

    label{ display:block; color:#ffb3b3; font-size:13px; margin: 10px 0 6px 0; }
    input, textarea{
      width:100%;
      padding:10px 12px;
      border-radius:10px;
      border:1px solid #ff1a1a55;
      background:#141414;
      color:#fff;
      outline:none;
      box-sizing:border-box;
    }
    textarea{ min-height: 110px; resize: vertical; }

    .row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content:space-between; }
    .btn{
      border:1px solid #ff1a1a55;
      background:#1a1a1a;
      color:#fff;
      cursor:pointer;
      padding:8px 12px;
      border-radius:10px;
      box-shadow:0 0 10px #ff1a1a22 inset, 0 0 10px #ff000033;
    }
    .btn:hover{ background:#2b0000; border-color:#ff1a1aaa; }

    .muted{ color:#ffb3b3; font-size:13px; }
    .ok{ color:#7bffb5; font-size:13px; }
    .err{ color:#ff7b7b; font-size:13px; }

    .entry{
      border:1px solid #ff1a1a22;
      border-radius: 12px;
      padding: 14px;
      background:#141414;
      box-shadow: 0 0 12px #ff000022 inset;
      margin-top: 10px;
    }
    .entry:target{
      outline: 2px solid #ff3b3b88;
      box-shadow: 0 0 18px #ff3b3b55, 0 0 18px #ff000055 inset;
    }
    .entryHead{
      display:flex; justify-content:space-between; align-items:flex-start; gap:10px; flex-wrap:wrap;
      margin-bottom: 8px;
    }
    .entryTitle{ font-size:16px; font-weight:700; margin:0; }
    .entryMeta{ color:#ffb3b3; font-size:12px; }
    .entryText{ white-space:pre-wrap; margin: 8px 0 0 0; }

    .chips{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    .chip{
      display:inline-block; padding:4px 10px; border-radius:999px;
      border:1px solid #ff1a1a55; background:#1a1a1a; font-size:12px;
    }
  </style>
</head>
<body>

<div class="topbar">
  <a href="index.html" class="linkbtn">⬅ Dashboard</a>
  <div class="userpill">
    <span class="pill" id="pillEmail">Non autenticato</span>
    <span class="pill" id="pillRole">Ruolo: —</span>
    <button class="linkbtn" onclick="logout()">Esci</button>
  </div>
</div>

<h1>Diario</h1>
<div class="subtitle">Accordi, promemoria, dettagli .. tutto tracciato per giorno</div>

<div class="wrap grid">

  <div class="card">
    <div class="row">
      <div class="muted">Nuova voce</div>
      <button class="btn" onclick="loadDiary()">Aggiorna</button>
    </div>

    <label>Titolo (opzionale)</label>
    <input id="inTitle" placeholder="Es. Accordo con .. / Appunto importante" />

    <label>Testo</label>
    <textarea id="inText" placeholder="Scrivi qui .."></textarea>

    <div class="row" style="margin-top:10px;">
      <div id="msg" class="muted"></div>
      <button class="btn" onclick="saveDiary()">Salva</button>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <div class="chips">
        <span class="chip">Voci recenti</span>
        <span class="chip" id="chipCount">0</span>
      </div>
      <div class="muted">Clic da ricerca: ti porta su #id</div>
    </div>

    <div id="list" class="muted" style="margin-top:10px;">Caricamento ..</div>
  </div>

</div>

<script>
  const pillEmail = document.getElementById("pillEmail");
  const pillRole  = document.getElementById("pillRole");
  const msgEl = document.getElementById("msg");
  const listEl = document.getElementById("list");
  const chipCount = document.getElementById("chipCount");

  const inTitle = document.getElementById("inTitle");
  const inText  = document.getElementById("inText");

  async function apiGet(url){
    const r = await fetch(url, { method:"GET", credentials:"include" });
    return r.json();
  }
  async function apiPost(url, data){
    const r = await fetch(url, {
      method:"POST",
      credentials:"include",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify(data || {})
    });
    return r.json();
  }

  function setMsg(ok, text){
    msgEl.className = ok ? "ok" : "err";
    msgEl.textContent = text || "";
  }

  async function logout(){
    try { await apiPost("/api/auth/logout", {}); } catch {}
    window.location.href = "index.html";
  }

  function escapeHtml(s) {
    return String(s ?? "")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  function fmtWhen(ms){
    if (!ms) return "—";
    try { return new Date(ms).toLocaleString(); } catch { return String(ms); }
  }

  async function guard(){
    const me = await apiGet("/api/auth/me");
    if (!me?.authenticated) {
      window.location.href = "index.html";
      return;
    }
    const role = (me.user?.role || "none").toLowerCase();
    if (role === "none") {
      alert("Sei in attesa di ruolo: accesso non consentito.");
      window.location.href = "index.html";
      return;
    }
    pillEmail.textContent = me.user.email || "—";
    pillRole.textContent  = "Ruolo: " + role;
  }

  async function saveDiary(){
    setMsg(true, "");
    const title = (inTitle.value || "").trim();
    const text  = (inText.value || "").trim();

    if (!text) return setMsg(false, "Scrivi qualcosa prima di salvare.");

    const out = await apiPost("/api/diary/create", { title, text });
    if (!out?.ok) return setMsg(false, out?.error || "Errore");

    setMsg(true, "Salvato ✅");
    inTitle.value = "";
    inText.value = "";
    loadDiary();
  }

  async function loadDiary(){
    listEl.textContent = "Caricamento ..";

    const out = await apiGet("/api/diary/list?limit=100");
    if (!out?.ok) {
      listEl.textContent = "Errore caricamento";
      return;
    }

    const items = out.items || [];
    chipCount.textContent = String(items.length);

    if (!items.length) {
      listEl.innerHTML = "<div class='muted'>Nessuna voce</div>";
      return;
    }

    listEl.innerHTML = items.map(e => {
      const title = e.title ? escapeHtml(e.title) : "Diario";
      const day = escapeHtml(e.day || "—");
      const when = fmtWhen(e.at);
      const by = escapeHtml(e.by || "—");
      const role = escapeHtml(e.byRole || "—");
      const text = escapeHtml(e.text || "");

      return `
        <div class="entry" id="${escapeHtml(e.id)}">
          <div class="entryHead">
            <div>
              <div class="entryTitle">${title}</div>
              <div class="entryMeta">${day} • ${when}</div>
            </div>
            <div class="entryMeta">${by} • ${role}</div>
          </div>
          <div class="entryText">${text}</div>
        </div>
      `;
    }).join("");

    // Se arrivi con hash (#id), scrolla bene
    if (location.hash) {
      const el = document.getElementById(location.hash.slice(1));
      if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
    }
  }

  (async function init(){
    await guard();
    await loadDiary();
  })();
</script>

</body>
</html>
