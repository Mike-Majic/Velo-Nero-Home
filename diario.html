<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>VELO NERO – Diario</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body{
      background:#0d0d0d;
      color:#fff;
      font-family:Arial,sans-serif;
      margin:0;
      padding:60px 20px;
      text-align:center;
    }

    h1{
      font-size:60px;
      letter-spacing:5px;
      color:#ff1a1a;
      text-shadow:0 0 12px #ff000080;
      margin:0 0 10px 0;
    }

    .subtitle{
      font-size:20px;
      color:#ff6666;
      margin-bottom:28px;
    }

    .topbar{
      max-width:1200px;
      margin:0 auto 18px auto;
      display:flex;
      justify-content:flex-end;
      gap:10px;
      flex-wrap:wrap;
    }

    .pill{
      padding:6px 10px;
      border-radius:999px;
      border:1px solid #ff1a1a55;
      background:#1a1a1a;
      font-size:13px;
      box-shadow:0 0 10px #ff1a1a22 inset,0 0 10px #ff000033;
    }

    .linkbtn{
      background:none;
      border:1px solid #ff1a1a55;
      color:#fff;
      padding:8px 12px;
      border-radius:10px;
      cursor:pointer;
      box-shadow:0 0 10px #ff1a1a22 inset,0 0 10px #ff000033;
    }

    .linkbtn:hover{
      background:#2b0000;
      border-color:#ff1a1aaa;
    }

    .nav{
      display:flex;
      justify-content:center;
      gap:12px;
      flex-wrap:wrap;
      margin-bottom:28px;
    }

    .nav button{
      background:#1a1a1a;
      color:#fff;
      border:1px solid #ff1a1a55;
      padding:10px 16px;
      border-radius:10px;
      cursor:pointer;
      box-shadow:0 0 10px #ff1a1a44 inset,0 0 12px #ff000066;
    }

    .nav button.active{
      background:#2b0000;
      border-color:#ff1a1aaa;
      box-shadow:0 0 18px #ff1a1a88 inset,0 0 18px #ff0000aa;
    }

    .container{
      max-width:1200px;
      margin:0 auto;
      text-align:left;
    }

    .searchbar{
      display:flex;
      gap:12px;
      flex-wrap:wrap;
      margin-bottom:14px;
    }

    .searchbar input{
      flex:1;
      background:#121212;
      border:1px solid #ff1a1a55;
      color:#fff;
      padding:12px 14px;
      border-radius:12px;
    }

    .btn{
      background:#1a1a1a;
      border:1px solid #ff1a1a99;
      color:#fff;
      padding:10px 16px;
      border-radius:10px;
      cursor:pointer;
      box-shadow:0 0 12px #ff1a1a44 inset,0 0 12px #ff000066;
    }

    .btn:hover{
      background:#2b0000;
    }

    table{
      width:100%;
      border-collapse:collapse;
      margin-top:14px;
    }

    th,td{
      padding:12px;
      border:1px solid #ff1a1a33;
      background:#1e1e1e;
      vertical-align:top;
    }

    th{
      color:#ff3b3b;
    }

    tr:hover td{
      background:#3a0000;
      cursor:pointer;
    }

    .muted{
      color:#ffaaaa;
      font-size:13px;
    }

    /* MODAL */
    .overlay{
      display:none;
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.7);
      z-index:1000;
      padding:24px;
    }

    .modal{
      max-width:900px;
      margin:0 auto;
      background:#121212;
      border:1px solid #ff1a1a77;
      border-radius:14px;
      padding:18px;
      box-shadow:0 0 20px #ff1a1a33,0 0 22px #ff000055 inset;
    }

    .modal h3{
      color:#ff3b3b;
      margin-top:0;
    }

    textarea,input,select{
      width:100%;
      background:#121212;
      border:1px solid #ff1a1a55;
      color:#fff;
      padding:10px;
      border-radius:10px;
    }

    textarea{
      min-height:120px;
      resize:vertical;
    }

    .row{
      display:flex;
      gap:12px;
      flex-wrap:wrap;
      margin-top:12px;
    }

    .right{
      margin-left:auto;
      display:flex;
      gap:10px;
    }
  </style>
</head>

<body>

  <div class="topbar">
    <span class="pill" id="userEmail">—</span>
    <span class="pill" id="userRole">Ruolo: —</span>
    <button class="linkbtn" onclick="location.href='index.html'">Esci</button>
  </div>

  <h1>VELO NERO</h1>
  <div class="subtitle">Diario</div>

  <div class="nav">
    <button onclick="location.href='index.html'">Dashboard</button>
    <button onclick="location.href='index.html#azioni'">Azioni</button>
    <button class="active">Diario</button>
    <button onclick="location.href='logs.html'">Log</button>
  </div>

  <div class="container">

    <div class="searchbar">
      <input id="searchInput" placeholder="Cerca nel diario (titolo, testo, autore)" />
      <button class="btn" onclick="loadDiary()">Cerca</button>
      <button class="btn" onclick="clearSearch()">Pulisci</button>
      <button class="btn" onclick="openNew()">Nuova nota</button>
    </div>

    <table>
      <thead>
        <tr>
          <th>Quando</th>
          <th>Tipo</th>
          <th>Risultato</th>
        </tr>
      </thead>
      <tbody id="diaryTable">
        <tr><td colspan="3" class="muted">Caricamento…</td></tr>
      </tbody>
    </table>

  </div>

  <!-- MODAL -->
  <div class="overlay" id="overlay">
    <div class="modal">
      <h3 id="modalTitle">Nuova nota</h3>

      <div class="row">
        <div style="flex:1;">
          <label>Titolo</label>
          <input id="noteTitle">
        </div>
        <div style="width:200px;">
          <label>Tipo</label>
          <select id="noteType">
            <option>Informazione</option>
            <option>Accordo</option>
            <option>Avvertimento</option>
            <option>Importante</option>
          </select>
        </div>
      </div>

      <div class="row">
        <div style="flex:1;">
          <label>Testo</label>
          <textarea id="noteText"></textarea>
        </div>
      </div>

      <div class="row">
        <div class="right">
          <button class="btn" onclick="closeModal()">Chiudi</button>
          <button class="btn" onclick="saveNote()">Salva</button>
        </div>
      </div>
    </div>
  </div>

<script>

const vnRemoteStore = window.vnRemoteStore || (() => {
  const cache = {};
  let loaded = false;

  function requestSync(method, url, body) {
    const xhr = new XMLHttpRequest();
    xhr.open(method, url, false);
    xhr.withCredentials = true;
    if (body !== undefined) xhr.setRequestHeader("Content-Type", "application/json");
    try {
      xhr.send(body === undefined ? undefined : JSON.stringify(body));
      if (xhr.status < 200 || xhr.status >= 300) return null;
      return xhr.responseText ? JSON.parse(xhr.responseText) : null;
    } catch {
      return null;
    }
  }

  function requestAsync(method, url, body) {
    return fetch(url, {
      method,
      credentials: "include",
      headers: body !== undefined ? { "Content-Type": "application/json" } : undefined,
      body: body === undefined ? undefined : JSON.stringify(body),
      keepalive: true
    }).catch(() => null);
  }

  function loadAll(force = false) {
    if (loaded && !force) return;
    const out = requestSync("GET", "/api/storage/all");
    Object.keys(cache).forEach(k => delete cache[k]);
    if (out && out.ok && out.items) Object.assign(cache, out.items);
    loaded = true;
  }

  return {
    reload() { loadAll(true); },
    getItem(key) {
      loadAll(false);
      return Object.prototype.hasOwnProperty.call(cache, key) ? cache[key] : null;
    },
    setItem(key, value) {
      loadAll(false);
      cache[key] = String(value ?? "");
      requestAsync("POST", "/api/storage/set", { key, value: cache[key] });
    },
    removeItem(key) {
      loadAll(false);
      delete cache[key];
      requestAsync("POST", "/api/storage/remove", { key });
    }
  };
})();
window.vnRemoteStore = vnRemoteStore;

const API_LIST = "/api/diary/list";
const API_CREATE = "/api/diary/create";
const API_SEARCH = "/api/search";

function getSession(){
  try{
    return JSON.parse(vnRemoteStore.getItem("vn_session_v1")) || null;
  }catch{
    return null;
  }
}

function boot(){
  const s = getSession();
  if(!s?.email){
    location.href = "index.html";
    return;
  }
  document.getElementById("userEmail").textContent = s.email;
  loadDiary();
}

async function loadDiary(){
  const q = (document.getElementById("searchInput").value || "").trim();
  const url = q ? (API_SEARCH + "?q=" + encodeURIComponent(q)) : (API_LIST + "?limit=100");

  const res = await fetch(url, { credentials:"include" });
  const data = await res.json();

  const rows = data?.results || data?.items || [];

  const tb = document.getElementById("diaryTable");
  tb.innerHTML = "";

  if(!rows.length){
    tb.innerHTML = `<tr><td colspan="3" class="muted">Nessuna nota</td></tr>`;
    return;
  }

  rows.forEach(n=>{
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${new Date(n.at || n.ts || Date.now()).toLocaleString()}</td>
      <td>${n.type || "diary"}</td>
      <td>${n.title || "Diario"}</td>
    `;
    tr.onclick = ()=>openView(n);
    tb.appendChild(tr);
  });
}

function clearSearch(){
  document.getElementById("searchInput").value="";
  loadDiary();
}

function openNew(){
  document.getElementById("modalTitle").textContent="Nuova nota";
  document.getElementById("noteTitle").value="";
  document.getElementById("noteText").value="";
  document.getElementById("overlay").style.display="block";
}

function openView(n){
  document.getElementById("modalTitle").textContent=n.title;
  document.getElementById("noteTitle").value=n.title;
  document.getElementById("noteText").value=n.text;
  document.getElementById("noteType").value=n.type;
  document.getElementById("overlay").style.display="block";
}

function closeModal(){
  document.getElementById("overlay").style.display="none";
}

async function saveNote(){
  const payload={
    title:noteTitle.value,
    text:noteText.value,
    type:noteType.value
  };

  await fetch(API_CREATE,{
    method:"POST",
    credentials:"include",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify(payload)
  });

  closeModal();
  loadDiary();
}

boot();
</script>

</body>
</html>
